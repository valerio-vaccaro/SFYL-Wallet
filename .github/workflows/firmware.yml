name: Build firmware

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'platformio.ini'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'platformio.ini'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: TTGO T-Watch firmware
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.platformio
      BUILD_DIR: .pio/build/ttgo-t-watch

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PLATFORMIO_CORE_DIR }}
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run --environment ttgo-t-watch

      - name: Create flash bundle
        run: |
          mkdir -p firmware
          cp "$BUILD_DIR/firmware.bin" firmware/
          cp "$BUILD_DIR/bootloader.bin" firmware/
          cp "$BUILD_DIR/partitions.bin" firmware/
          cp "$PLATFORMIO_CORE_DIR/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" firmware/
          {
            echo "SFYL Wallet firmware build"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "Flash with PlatformIO: pio run -e ttgo-t-watch -t upload"
          } > firmware/README.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: sfyl-wallet-firmware-${{ github.sha }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30
